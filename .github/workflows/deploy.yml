name: Build and deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - name: Install managed API dependencies
        run: npm install --omit=dev --prefix dist/api
      - name: Deploy website and managed API
        id: deploy
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: Azure/static-web-apps-deploy@1a947af9992250f3bc2e68ad0754c0b0c11566c9 # v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: dist/site
          api_location: dist/api
          output_location: ''
          skip_app_build: true
          skip_api_build: true
          production_branch: main
      - name: Check deployed API and database
        if: steps.deploy.outcome == 'success'
        env:
          SITE_URL: ${{ steps.deploy.outputs.static_web_app_url }}
        run: |
          curl --fail --silent --show-error --retry 8 --retry-all-errors --retry-delay 10 "$SITE_URL/api/health" | node -e '
            let body = "";
            process.stdin.on("data", chunk => body += chunk);
            process.stdin.on("end", () => {
              if (JSON.parse(body).status !== "ok") process.exit(1);
            });'
