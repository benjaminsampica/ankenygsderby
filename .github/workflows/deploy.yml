name: Build and deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - name: Install managed API dependencies
        run: npm install --omit=dev --prefix dist/api
      - name: Deploy website and managed API
        id: deploy
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: Azure/static-web-apps-deploy@4d27395796ac319302594769cfe812bd207490b1 # v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: dist/site
          api_location: dist/api
          output_location: ''
          skip_app_build: true
          skip_api_build: true
          production_branch: main
      - name: Check deployed API and database
        if: steps.deploy.outcome == 'success'
        env:
          SITE_URL: ${{ steps.deploy.outputs.static_web_app_url }}
        run: |
          curl --fail --silent --show-error --retry 8 --retry-all-errors --retry-delay 10 "$SITE_URL/api/health" | node -e '
            let body = "";
            process.stdin.on("data", chunk => body += chunk);
            process.stdin.on("end", () => {
              if (JSON.parse(body).status !== "ok") process.exit(1);
            });'
